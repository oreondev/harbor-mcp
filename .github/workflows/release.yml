name: Release

# A vX.Y.Z tag on main publishes a release: the multi-arch image (signed with
# cosign, with SBOM and provenance), binaries with signed checksums in a
# GitHub release, and server.json in the official MCP Registry. Pushes to
# develop publish an edge image tagged "develop" and "sha-<commit>" for
# testing; it is not a release.
on:
  push:
    branches: [develop]
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/oreondev/harbor-mcp
  PLATFORMS: linux/amd64,linux/arm64
  MCP_PUBLISHER_VERSION: v1.8.7

jobs:
  check:
    name: Check and test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${REF_NAME#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $REF_NAME is not on main"; exit 1
          fi
          json_version=$(jq -r .version server.json)
          json_image=$(jq -r '.packages[0].identifier' server.json)
          if [ "$json_version" != "$version" ] || [ "$json_image" != "$IMAGE:$version" ]; then
            echo "::error::server.json has version $json_version and image $json_image; set both to $version first"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Run linter
        run: make lint

      - name: Validate server.json
        run: make validate-server-json

  publish:
    name: Publish
    needs: check
    permissions:
      contents: write   # GitHub release
      packages: write   # image on ghcr.io
      id-token: write   # keyless cosign signing and MCP Registry login
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/develop' }}
          labels: |
            org.opencontainers.image.title=Harbor MCP server
            org.opencontainers.image.description=MCP server for Harbor: projects, artifacts, vulnerabilities, robots and replication
            org.opencontainers.image.licenses=Apache-2.0
            io.modelcontextprotocol.server.name=io.github.oreondev/harbor-mcp

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: VERSION=${{ needs.check.outputs.version || format('develop-{0}', github.sha) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: ./hack/cosign-sign.sh "$IMAGE@$DIGEST"

      - name: Setup Go
        if: github.ref_type == 'tag'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Build the binaries
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          make dist VERSION="$VERSION"
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > notes.md <<EOF
          Image: \`$IMAGE:$VERSION\` (\`$DIGEST\`), signed with cosign (keyless, GitHub Actions OIDC).
          Binaries for Linux, macOS and Windows below; \`checksums.txt\` is signed (\`checksums.txt.sigstore.json\`).
          Listed in the MCP Registry as \`io.github.oreondev/harbor-mcp\`.
          EOF
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt dist/checksums.txt.sigstore.json \
            --verify-tag --title "$TAG" --notes-file notes.md --generate-notes

      # Last, so a failure here leaves a complete GitHub release; rerun the job to retry.
      - name: Publish to the MCP Registry
        if: github.ref_type == 'tag'
        run: |
          go install "github.com/modelcontextprotocol/registry/cmd/publisher@$MCP_PUBLISHER_VERSION"
          publisher="$(go env GOPATH)/bin/publisher"
          "$publisher" login github-oidc
          "$publisher" publish
