version: "2"
run:
  build-tags:
    - e2e
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    gocyclo:
      min-complexity: 40
    lll:
      line-length: 140
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    rules:
      - linters:
          - goconst
          - unparam
          - lll
        path: _test\.go
      - linters:
          - lll
        path: internal/
formatters:
  enable:
    - gofmt
    - goimports
