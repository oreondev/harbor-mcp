site_name: Harbor MCP server
site_description: A read-only MCP server that lets AI assistants answer questions about a Harbor container registry.
site_url: https://www.oreonit.com/harbor-mcp/
site_author: Oreon IT
repo_url: https://github.com/oreondev/harbor-mcp
repo_name: oreondev/harbor-mcp
edit_uri: edit/develop/docs/
copyright: >-
  Copyright 2026 <a href="https://www.oreonit.com">Oreon IT</a>.
  Apache-2.0; the Oreon IT logo is a trademark of Oreon IT and not covered by the licence.
  Harbor is a trademark of The Linux Foundation; this project is not affiliated with the Harbor project or the CNCF.

docs_dir: docs
exclude_docs: |
  requirements.txt

hooks:
  - hack/docs/hooks.py

theme:
  name: material
  custom_dir: overrides
  logo: images/oreon-icon.svg
  favicon: images/oreon-favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Light mode }
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.suggest
    - toc.follow

plugins:
  - search
  - mike:
      alias_type: copy
      canonical_version: latest
      version_selector: true

extra_css:
  - stylesheets/oreon.css

extra:
  product: harbor-mcp   # current site in the product bar (overrides/partials/products.html)
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oreondev/harbor-mcp

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Connect a client: clients.md
  - Guides:
      - Read-only identity: read-only-robot.md
      - HTTP mode: http.md
      - Agent skills: skills.md
  - Tools: tools.md
  - Project:
      - Release notes: changelog.md
      - Design: DESIGN.md
      - GitHub releases: https://github.com/oreondev/harbor-mcp/releases
      - Security: https://github.com/oreondev/harbor-mcp/blob/main/SECURITY.md
      - Harbor Resource Operator: https://www.oreonit.com/harbor-operator/
